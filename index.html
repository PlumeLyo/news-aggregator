<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NewsPulse · AI 资讯精选聚合</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
--bg:#f5f5f7;--bg-soft:#ffffff;--bg-hover:#f0f0f2;--bg-glass:rgba(255,255,255,.8);
--ink:#1d1d1f;--ink-2:#6e6e73;--ink-3:#a1a1a6;
--line:rgba(0,0,0,.06);--line-strong:rgba(0,0,0,.1);
--accent:#0071e3;--accent-light:#e8f1fd;--accent-dark:#0058b0;
--green:#34c759;--green-dark:#2da44e;--green-light:#e8f9ed;
--orange:#ff9500;--red:#ff3b30;--yellow:#ffcc00;
--tag-bg:#f0f0f2;--tag-text:#86868b;
--sel-bg:#fff8e6;--sel-text:#b8860b;
--reason-bg:#eef5ff;--reason-text:#0058b0;
--shadow-sm:0 1px 3px rgba(0,0,0,.04);
--shadow-md:0 4px 16px rgba(0,0,0,.06);
--shadow-lg:0 8px 30px rgba(0,0,0,.08);
--radius-sm:8px;--radius-md:12px;--radius-lg:16px;--radius-xl:20px;
--font-display:"Inter","Noto Sans SC","PingFang SC",sans-serif;
--font-body:"Inter","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
--ease-out:cubic-bezier(.16,1,.3,1);
--ease-spring:cubic-bezier(.34,1.56,.64,1);
}
@media(prefers-color-scheme:dark){
:root{--bg:#1c1c1e;--bg-soft:#2c2c2e;--bg-hover:#3a3a3c;--bg-glass:rgba(44,44,46,.8);
--ink:#f5f5f7;--ink-2:#a1a1a6;--ink-3:#6e6e73;
--line:rgba(255,255,255,.08);--line-strong:rgba(255,255,255,.15);
--accent:#0a84ff;--accent-light:#1c2c40;--accent-dark:#409cff;
--green:#30d158;--green-dark:#28a745;--green-light:#1c2e1c;
--tag-bg:#3a3a3c;--tag-text:#a1a1a6;
--sel-bg:#3d3520;--sel-text:#ffd60a;
--reason-bg:#1a2438;--reason-text:#5ab0ff;
--shadow-sm:0 1px 3px rgba(0,0,0,.3);
--shadow-md:0 4px 16px rgba(0,0,0,.4);
--shadow-lg:0 8px 30px rgba(0,0,0,.5);}
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);
font-family:var(--font-body);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;
overflow-x:hidden;overflow-wrap:anywhere}
a{color:inherit;text-decoration:none}
button{font-family:var(--font-body)}

.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}

.side{background:var(--bg-glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;gap:2px;
position:sticky;top:0;height:100vh;overflow-y:auto;
animation:slide-right .4s var(--ease-out)}
@keyframes slide-right{from{transform:translateX(-16px);opacity:0}to{transform:translateX(0);opacity:1}}
.side::-webkit-scrollbar{width:4px}
.side::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:2px}

.brand{display:flex;align-items:center;gap:10px;padding:8px;margin-bottom:12px}
.brand-icon{width:34px;height:34px;border-radius:var(--radius-sm);
display:grid;place-items:center;font-weight:800;font-size:15px;color:var(--ink);
border:2px solid var(--ink);letter-spacing:-.02em;font-family:var(--font-display)}
.brand-name{font-weight:800;font-size:15px;font-family:var(--font-display);letter-spacing:-.01em}
.brand-sub{font-size:10px;color:var(--ink-3);margin-top:1px}

.side-section{margin-top:16px;padding:0 10px;color:var(--ink-3);
font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:600}

.nav{margin-top:4px;display:flex;flex-direction:column;gap:1px}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;
border-radius:var(--radius-sm);color:var(--ink-2);cursor:pointer;font-size:13px;
transition:all .18s var(--ease-out);border:none;background:none;width:100%;text-align:left;font-weight:500}
.nav-item:hover{background:var(--bg-hover);color:var(--ink)}
.nav-item.active{background:var(--accent-light);color:var(--accent);font-weight:600}
.nav-icon{width:17px;height:17px;flex-shrink:0;opacity:.7;transition:opacity .2s}
.nav-item.active .nav-icon{opacity:1}
.nav-item:hover .nav-icon{opacity:.9}
.nav-count{margin-left:auto;font-size:10px;color:var(--ink-3);
font-weight:600;font-variant-numeric:tabular-nums}
.nav-item.active .nav-count{color:var(--accent)}

.side-bottom{margin-top:auto;padding-top:16px;border-top:1px solid var(--line);
display:flex;flex-direction:column;gap:2px}
.side-toggle{display:flex;align-items:center;gap:9px;padding:8px 10px;
border-radius:var(--radius-sm);color:var(--ink-3);cursor:pointer;font-size:12px;
transition:all .18s;border:none;background:none;width:100%;text-align:left}
.side-toggle:hover{background:var(--bg-hover);color:var(--ink-2)}
.side-toggle svg{width:16px;height:16px;opacity:.7}
.icp{text-align:center;font-size:9px;color:var(--ink-3);padding:8px 0 4px;line-height:1.5}

.main{display:flex;flex-direction:column;min-width:0;flex:1;overflow:visible}
.page{padding:32px 36px 64px;max-width:960px;margin:0 auto;width:100%;min-width:0;box-sizing:border-box}
.page-header{margin-bottom:24px;animation:fade-up .4s var(--ease-out)}
@keyframes fade-up{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}
.page-title{font-family:var(--font-display);font-size:28px;font-weight:800;
letter-spacing:-.02em;margin:0 0 6px;color:var(--ink)}
.page-subtitle{font-size:13px;color:var(--ink-2);margin:0}

.cat-bar{display:flex;align-items:center;gap:0;margin-bottom:24px;
border-bottom:1px solid var(--line);animation:fade-up .4s var(--ease-out) .05s both}
.cat-tab{position:relative;padding:8px 16px;font-size:14px;font-weight:500;
color:var(--ink-2);cursor:pointer;border:none;background:none;
transition:color .2s;white-space:nowrap}
.cat-tab:hover{color:var(--ink)}
.cat-tab.active{color:var(--accent);font-weight:600}
.cat-tab.active::after{content:'';position:absolute;bottom:-1px;left:16px;right:16px;
height:2px;background:var(--accent);border-radius:1px}
.cat-spacer{flex:1}
.search-wrap{display:flex;align-items:center;gap:8px;padding-bottom:8px}
.search-input{height:32px;width:200px;border:1px solid var(--line-strong);
border-radius:var(--radius-sm);background:var(--bg-soft);color:var(--ink);
padding:0 12px;font-size:12px;outline:none;font-family:var(--font-body);transition:all .2s}
.search-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-light)}
.search-input::placeholder{color:var(--ink-3)}
.search-btn{height:32px;padding:0 14px;border:none;border-radius:var(--radius-sm);
background:var(--green-dark);color:#fff;font-size:12px;font-weight:600;
cursor:pointer;transition:all .2s;font-family:var(--font-body)}
.search-btn:hover{background:var(--green);transform:translateY(-1px)}

.hot-section{margin-bottom:28px;animation:fade-up .4s var(--ease-out) .1s both}
.hot-header{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.hot-title{font-size:16px;font-weight:700;color:var(--ink);font-family:var(--font-display)}
.hot-badge{font-size:11px;color:var(--orange);background:rgba(255,149,0,.1);
padding:2px 8px;border-radius:999px;font-weight:600}
.hot-card{background:var(--bg-soft);border:1px solid var(--line);
border-radius:var(--radius-lg);padding:8px 20px;box-shadow:var(--shadow-sm);
transition:box-shadow .3s}
.hot-card:hover{box-shadow:var(--shadow-md)}
.hot-item{display:flex;align-items:center;gap:12px;padding:10px 0;
border-bottom:1px solid var(--line);cursor:pointer;transition:all .18s}
.hot-item:last-child{border-bottom:none}
.hot-item:hover{transform:translateX(4px)}
.hot-rank{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;
font-size:13px;font-weight:800;font-family:var(--font-display);flex-shrink:0}
.hot-rank.r1{background:rgba(255,59,48,.12);color:var(--red)}
.hot-rank.r2{background:rgba(255,149,0,.12);color:var(--orange)}
.hot-rank.r3{background:rgba(255,204,0,.15);color:#cca400}
.hot-rank.r4,.hot-rank.r5{background:var(--tag-bg);color:var(--ink-3)}
.hot-text{flex:1;min-width:0}
.hot-item-title{font-size:13.5px;font-weight:600;color:var(--ink);
overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:color .2s}
.hot-item:hover .hot-item-title{color:var(--accent)}
.hot-sources{font-size:11px;color:var(--ink-3);flex-shrink:0;font-weight:500}
.hot-heat{font-size:11px;color:var(--orange);font-weight:700;flex-shrink:0;margin-left:8px}

.feed-header{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.feed-date{font-size:14px;font-weight:700;color:var(--ink);font-family:var(--font-display)}
.feed-count{font-size:12px;color:var(--ink-3);font-weight:500}

.news-feed{display:flex;flex-direction:column;gap:14px;width:100%;min-width:0}

.news-card{background:var(--bg-soft);border:1px solid var(--line);
border-radius:var(--radius-lg);padding:20px 22px;
transition:all .25s var(--ease-out);position:relative;
box-shadow:var(--shadow-sm);
animation:card-enter .35s var(--ease-out) both;word-break:break-word;overflow-wrap:anywhere;box-sizing:border-box;width:100%}
@keyframes card-enter{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}
.news-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:var(--line-strong)}
.news-card.unread{border-left:3px solid var(--green)}

.news-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.news-source{font-size:11px;font-weight:600;color:var(--ink-2);
display:flex;align-items:center;gap:6px}
.news-source-dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0}
.news-sel{font-size:10px;font-weight:600;color:var(--sel-text);
background:var(--sel-bg);padding:2px 7px;border-radius:4px;letter-spacing:.02em}
.news-spacer{flex:1}
.news-heat{font-size:11px;color:var(--ink-3);font-weight:600;
display:flex;align-items:center;gap:3px;font-variant-numeric:tabular-nums}
.news-heat svg{width:12px;height:12px;opacity:.6}
.news-bookmark{width:28px;height:28px;border-radius:6px;border:none;background:none;
cursor:pointer;display:grid;place-items:center;color:var(--ink-3);
transition:all .2s;padding:0;flex-shrink:0}
.news-bookmark:hover{background:var(--bg-hover);color:var(--accent)}
.news-bookmark svg{width:15px;height:15px}
.news-bookmark.active{color:var(--accent)}
.news-bookmark.active svg{fill:var(--accent)}

.news-time{font-size:11px;color:var(--ink-3);font-weight:500;
font-variant-numeric:tabular-nums;margin-bottom:8px;display:flex;align-items:center;gap:6px}

.news-title{font-size:16px;font-weight:700;line-height:1.5;margin-bottom:8px;color:var(--ink);
transition:color .2s;letter-spacing:-.005em;cursor:pointer}
.news-card:hover .news-title{color:var(--accent)}

.news-summary{font-size:13.5px;color:var(--ink-2);line-height:1.7;overflow-wrap:anywhere}

.news-reason{margin-top:10px;padding:10px 14px;background:var(--reason-bg);
border-radius:var(--radius-sm);font-size:12px;color:var(--reason-text);line-height:1.6;
display:flex;gap:8px;align-items:flex-start}
.news-reason-icon{flex-shrink:0;margin-top:1px;opacity:.7}
.news-reason-label{font-weight:700;flex-shrink:0}

.news-tags{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.tag{height:22px;display:inline-flex;align-items:center;border-radius:6px;
background:var(--tag-bg);color:var(--tag-text);padding:0 9px;font-size:10.5px;font-weight:500;
transition:all .2s;cursor:pointer}
.tag:hover{background:var(--line-strong);color:var(--ink-2)}

.news-link{display:inline-flex;align-items:center;gap:4px;margin-top:11px;
font-size:12px;font-weight:600;color:var(--accent);
transition:all .2s var(--ease-out)}
.news-link:hover{gap:6px;text-decoration:underline}

.timeline-group{margin-bottom:8px}
.time-label{display:block;font-size:13px;font-weight:700;
color:var(--ink);font-family:var(--font-display);padding:0 0 12px;letter-spacing:.01em}

.empty-state{text-align:center;padding:60px 28px;color:var(--ink-3);
border:2px dashed var(--line-strong);border-radius:var(--radius-xl);
animation:fade-up .4s var(--ease-out)}
.empty-state-icon{font-size:42px;margin-bottom:16px;opacity:.6}
.empty-state-text{font-size:15px;margin-bottom:7px;font-weight:600;color:var(--ink-2)}
.empty-state-hint{font-size:12px}

.skeleton{background:linear-gradient(90deg,var(--bg-hover) 25%,var(--bg-soft) 50%,var(--bg-hover) 75%);
background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:var(--radius-lg);height:120px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

.footer{text-align:center;padding:36px 0 18px;color:var(--ink-3);
font-size:11px;border-top:1px solid var(--line);margin-top:48px}
.footer a{color:var(--ink-2);transition:color .2s}
.footer a:hover{color:var(--accent)}

.toast{position:fixed;bottom:28px;left:50%;
transform:translateX(-50%) translateY(80px);
background:var(--ink);color:var(--bg-soft);padding:12px 24px;
border-radius:var(--radius-md);font-size:13px;font-weight:500;opacity:0;
transition:all .3s var(--ease-spring);z-index:100;pointer-events:none;
box-shadow:var(--shadow-lg);backdrop-filter:blur(10px)}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

@media(max-width:980px){
.app{grid-template-columns:1fr}
.side{display:none}
.page{padding:24px 18px 48px}
}
@media(max-width:640px){
.search-wrap{display:none}
.page-title{font-size:22px}
.news-card{padding:16px}
.cat-tab{padding:6px 10px;font-size:13px}
}
</style>
</head>

</div>

<main class="main">
<div class="page">
<div class="page-header">

<p class="page-subtitle" id="dateStr">AI 自动挑选的高价值内容</p>

<span class="feed-date" id="feedDate">加载中…</span>
<span class="feed-count" id="feedCount"></span>
</div>

<div class="news-feed" id="newsFeed"></div>
<div class="empty-state" id="emptyState" style="display:none">
<div class="empty-state-icon">🔍</div>
<div class="empty-state-text">当前筛选条件下暂无内容</div>
<div class="empty-state-hint">试试切换分类或清除搜索关键词</div>
</div>

<footer class="footer">
<p>NewsPulse · AI 驱动的资讯精选聚合平台</p>
<p style="margin-top:4px">数据来源 <a href="https://aihot.virxact.com" target="_blank">aihot.virxact.com</a> · 每 5 分钟自动同步</p>
</footer>
</div>
</main>
</div>
<div class="toast" id="toast"></div>

<script>
// ============================================================
// NewsPulse v4.1 — AI 资讯精选（aihot API 实时接入）
// ============================================================

var API_BASE = "https://aihot.virxact.com/api/public";
var AUTO_REFRESH_MS = 300000; // 5分钟自动刷新

var NEWS_DATA = [];
var HOT_DATA = [];
var CAT_NAMES = {"ai-models":"模型","ai-products":"产品","industry":"行业","paper":"论文","tip":"教程","opinion":"观点"};
var curCat = "all", searchQuery = "";
var curView = "selected";
var favorites = [];
var isDarkMode = false;

function gid(id){return document.getElementById(id);}
var feed = gid("newsFeed"), empty = gid("emptyState");
var searchInput = gid("searchInput");

// ===== 时间格式化 =====
function utcToBeijing(iso){
  var d = new Date(iso);
  return new Date(d.getTime() + 8*3600000);
}
function formatTime(iso){
  var d = utcToBeijing(iso);
  var h = String(d.getHours()).padStart(2,"0");
  var m = String(d.getMinutes()).padStart(2,"0");
  return h+":"+m;
}
function formatDate(iso){
  var d = utcToBeijing(iso);
  return (d.getMonth()+1)+"月"+d.getDate()+"日";
}
function formatWeekday(iso){
  var d = utcToBeijing(iso);
  var days = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
  return days[d.getDay()];
}
function todayStr(){
  var today = new Date();
  var days = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
  return today.getFullYear()+"年"+(today.getMonth()+1)+"月"+today.getDate()+"日 "+days[today.getDay()];
}

// ===== API 字段映射 =====
function mapItem(item, isSelected){
  return {
    id: item.id,
    title: item.title || "",
    source: item.source || "未知来源",
    category: item.category || "other",
    publishedAt: item.publishedAt || new Date().toISOString(),
    summary: item.summary || "",
    tags: extractTags(item),
    url: item.url || item.permalink || "#",
    heat: item.score || 0,
    sources: Math.max(1, Math.floor((item.score || 0) / 12)),
    aiSelected: isSelected,
    reason: null
  };
}

function extractTags(item){
  var tags = [];
  if(item.category && CAT_NAMES[item.category]){
    tags.push(CAT_NAMES[item.category]);
  }
  var title = (item.title || "") + " " + (item.summary || "");
  var keywords = {
    "OpenAI":"OpenAI","Anthropic":"Anthropic","Google":"Google","Kimi":"Kimi",
    "Claude":"Claude","GPT":"GPT","Meta":"Meta","微软":"微软",
    "论文":"论文","开源":"开源","模型":"模型","API":"API",
    "Agent":"Agent","Gemini":"Gemini","Perplexity":"Perplexity",
    "Midjourney":"Midjourney","FLUX":"FLUX","安全":"安全","监管":"监管"
  };
  for(var k in keywords){
    if(title.indexOf(k) >= 0 && tags.indexOf(keywords[k]) < 0) tags.push(keywords[k]);
  }
  return tags.slice(0, 5);
}

// ===== 渲染热点 =====
function renderHot(){
  var c = gid("hotCard");
  if(!HOT_DATA.length){c.innerHTML = '<div style="padding:16px;text-align:center;color:var(--ink-3);font-size:12px">暂无热点数据</div>';return;}
  var html = "";
  for(var i=0; i<HOT_DATA.length; i++){
    var h = HOT_DATA[i], rankClass = "r"+(i+1);
    html += '<div class="hot-item">';
    html += '<span class="hot-rank '+rankClass+'">'+(i+1)+'</span>';
    html += '<span class="hot-text"><span class="hot-item-title">'+h.title+'</span></span>';
    html += '<span class="hot-sources">热度 '+h.heat+'</span>';
    html += '</div>';
  }
  c.innerHTML = html;
}

// ===== 渲染资讯流 =====
function render(){
  var data = NEWS_DATA;

  // 收藏视图只显示已收藏
  if(curView === "favorites"){
    data = data.filter(function(n){return favorites.indexOf(n.id) >= 0;});
  }

  var filtered = data.filter(function(n){
    if(curCat !== "all" && n.category !== curCat) return false;
    if(searchQuery){
      var q = searchQuery.toLowerCase();
      if(n.title.toLowerCase().indexOf(q) < 0 && (n.summary||"").toLowerCase().indexOf(q) < 0) return false;
    }
    return true;
  });

  gid("feedCount").textContent = "· " + filtered.length + "条";
  gid("countAll").textContent = NEWS_DATA.length;
  gid("countSelected").textContent = NEWS_DATA.filter(function(n){return n.aiSelected;}).length;
  gid("countFav").textContent = favorites.length;

  empty.style.display = filtered.length ? "none" : "block";
  if(!filtered.length){feed.innerHTML = ""; return;}

  // 按日期分组
  var grouped = {};
  for(var i=0; i<filtered.length; i++){
    var n = filtered[i];
    var dateKey = formatDate(n.publishedAt);
    if(!grouped[dateKey]) grouped[dateKey] = [];
    grouped[dateKey].push(n);
  }

  var dates = Object.keys(grouped).sort(function(a,b){
    return new Date(b).getTime() - new Date(a).getTime();
  });

  var html = "", cardIdx = 0;
  for(var di=0; di<dates.length; di++){
    var date = dates[di], items = grouped[date];
    items.sort(function(a,b){
      return new Date(b.publishedAt).getTime() - new Date(a.publishedAt).getTime();
    });

    var firstItem = items[0];
    html += '<div class="timeline-group" style="animation-delay:'+(cardIdx*0.04)+'s">';
    html += '<span class="time-label">'+date+' '+formatWeekday(firstItem.publishedAt)+' · '+items.length+'条</span>';

    for(var ii=0; ii<items.length; ii++){
      var item = items[ii], isFav = favorites.indexOf(item.id) >= 0;
      var cardClass = item.aiSelected ? " unread" : "";

      html += '<div class="news-card'+cardClass+'" style="animation-delay:'+(cardIdx*0.03)+'s">';
      html += '<div class="news-top">';
      html += '<span class="news-source"><span class="news-source-dot"></span>'+item.source+'</span>';
      if(item.aiSelected){
        html += '<span class="news-sel">精选</span>';
      }
      html += '<span class="news-spacer"></span>';
      if(item.heat){
        html += '<span class="news-heat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>'+item.heat+'</span>';
      }
      html += '<button class="news-bookmark'+(isFav?" active":"")+'" data-id="'+item.id+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg></button>';
      html += '</div>';

      html += '<div class="news-time">'+formatTime(item.publishedAt)+'</div>';
      html += '<div class="news-title">'+item.title+'</div>';

      if(item.summary){
        html += '<div class="news-summary">'+item.summary+'</div>';
      }

      if(item.reason){
        html += '<div class="news-reason">';
        html += '<span class="news-reason-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg></span>';
        html += '<span class="news-reason-label">推荐理由：</span>';
        html += '<span>'+item.reason+'</span>';
        html += '</div>';
      }

      if(item.tags && item.tags.length){
        html += '<div class="news-tags">';
        for(var ti=0; ti<item.tags.length; ti++){
          html += '<span class="tag">#'+item.tags[ti]+'</span>';
        }
        html += '</div>';
      }

      if(item.url && item.url !== "#"){
        html += '<a href="'+item.url+'" target="_blank" rel="noopener" class="news-link">查看原文 →</a>';
      }

      html += '</div>';
      cardIdx++;
    }
    html += '</div>';
  }
  feed.innerHTML = html;

  document.querySelectorAll(".news-bookmark").forEach(function(btn){
    btn.addEventListener("click", function(e){
      e.stopPropagation();
      var id = this.dataset.id;
      var idx = favorites.indexOf(id);
      if(idx >= 0){favorites.splice(idx, 1); this.classList.remove("active");}
      else{favorites.push(id); this.classList.add("active");}
      gid("countFav").textContent = favorites.length;
      toast(favorites.indexOf(id) >= 0 ? "已收藏" : "已取消收藏");
    });
  });
}

function toast(msg){
  var t = gid("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(function(){t.classList.remove("show");}, 2000);
}

// ===== 从 API 加载实时数据 =====
function loadLiveData(){
  feed.innerHTML = '<div class="skeleton" style="margin-bottom:12px"></div><div class="skeleton" style="margin-bottom:12px"></div><div class="skeleton"></div>';

  var mode = (curView === "all") ? "all" : "selected";
  var take = (curView === "all") ? 80 : 50;

  // 先请求精选数据（用于标记精选标签和热点）
  var selectedPromise = fetch(API_BASE + "/items?mode=selected&take=50", {cache:"no-store"})
    .then(function(r){if(!r.ok) throw new Error("HTTP "+r.status); return r.json();})
    .catch(function(){return {items:[]};});

  // 再请求当前视图的数据
  var mainPromise = fetch(API_BASE + "/items?mode=" + mode + "&take=" + take, {cache:"no-store"})
    .then(function(r){if(!r.ok) throw new Error("HTTP "+r.status); return r.json();})
    .catch(function(){return {items:[]};});

  Promise.all([selectedPromise, mainPromise])
  .then(function(results){
    var selectedData = results[0], mainData = results[1];
    var selectedIds = {};

    // 记录精选ID
    if(selectedData && selectedData.items){
      selectedData.items.forEach(function(item){selectedIds[item.id] = true;});
    }

    var items = (mainData && mainData.items) ? mainData.items : [];

    if(!items.length){
      throw new Error("No items");
    }

    NEWS_DATA = items.map(function(item){
      return mapItem(item, selectedIds[item.id] || item.selected || false);
    });

    // 从精选数据生成热点（按 score 排序取前5）
    if(selectedData && selectedData.items && selectedData.items.length){
      HOT_DATA = selectedData.items.slice()
        .sort(function(a,b){return (b.score||0) - (a.score||0);})
        .slice(0, 5)
        .map(function(n){
          return {title: n.title || "", heat: n.score || 0};
        });
    } else {
      HOT_DATA = NEWS_DATA.slice()
        .sort(function(a,b){return (b.heat||0) - (a.heat||0);})
        .slice(0, 5)
        .map(function(n){return {title: n.title, heat: n.heat};});
    }

    renderHot();
    toast("已加载 " + NEWS_DATA.length + " 条实时资讯");
  })
  .catch(function(err){
    console.warn("API加载失败:", err.message);
    feed.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📡</div><div class="empty-state-text">无法连接到 API</div><div class="empty-state-hint">请检查网络连接，或稍后重试</div></div>';
    toast("API 连接失败");
  })
  .then(function(){
    render();
  });
}

// ===== 事件绑定 =====
document.querySelectorAll(".cat-tab").forEach(function(b){
  b.addEventListener("click", function(){
    curCat = this.dataset.cat;
    document.querySelectorAll(".cat-tab").forEach(function(x){x.classList.toggle("active", x === b);});
    render();
  });
});

document.querySelectorAll(".nav-item[data-view]").forEach(function(b){
  b.addEventListener("click", function(){
    document.querySelectorAll(".nav-item").forEach(function(x){x.classList.remove("active");});
    this.classList.add("active");
    curView = this.dataset.view;
    var viewLabels = {
      "selected":"精选","all":"全部AI动态","daily":"AI日报",
      "topics":"主题","favorites":"收藏"
    };
    var label = viewLabels[curView] || "精选";
    gid("pageTitle").textContent = label;

    if(curView === "selected"){
      gid("dateStr").textContent = todayStr() + " · AI 自动挑选的高价值内容";
      gid("hotSection").style.display = "";
    } else if(curView === "all"){
      gid("dateStr").textContent = todayStr() + " · 全部 AI 动态";
      gid("hotSection").style.display = "none";
    } else if(curView === "favorites"){
      gid("dateStr").textContent = "我收藏的资讯";
      gid("hotSection").style.display = "none";
    } else {
      gid("dateStr").textContent = label;
      gid("hotSection").style.display = "none";
    }

    // 切换视图时重新加载
    if(curView === "selected" || curView === "all"){
      loadLiveData();
    } else {
      render();
    }
  });
});

var searchTimer;
searchInput.addEventListener("input", function(e){
  clearTimeout(searchTimer);
  searchTimer = setTimeout(function(){
    searchQuery = e.target.value.trim();
    render();
  }, 200);
});

gid("searchBtn").addEventListener("click", function(){
  searchQuery = searchInput.value.trim();
  render();
});

gid("darkToggle").addEventListener("click", function(){
  isDarkMode = !isDarkMode;
  document.documentElement.style.setProperty("color-scheme", isDarkMode ? "dark" : "light");
  this.style.color = isDarkMode ? "var(--accent)" : "";
  toast(isDarkMode ? "已切换到深色模式" : "已切换到浅色模式");
});

// ===== 初始化 =====
gid("dateStr").textContent = todayStr() + " · AI 自动挑选的高价值内容";
var today = new Date();
var days = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
gid("feedDate").textContent = (today.getMonth()+1)+"月"+today.getDate()+"日 "+days[today.getDay()];

loadLiveData();

if(AUTO_REFRESH_MS > 0){
  setInterval(function(){
    if(curView === "selected" || curView === "all"){
      loadLiveData();
    }
  }, AUTO_REFRESH_MS);
}
</script>
</body>
</html>
