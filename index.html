<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NewsPulse · AI 筛选要闻聚合</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
--bg:#f5f5f7;--bg-soft:#ffffff;--bg-hover:#f0f0f2;--bg-glass:rgba(255,255,255,.8);
--ink:#1d1d1f;--ink-2:#6e6e73;--ink-3:#a1a1a6;
--line:rgba(0,0,0,.06);--line-strong:rgba(0,0,0,.1);
--accent:#0071e3;--accent-light:#e8f1fd;--accent-dark:#0058b0;
--green:#34c759;--green-dark:#2da44e;
--orange:#ff9500;--red:#ff3b30;--yellow:#ffcc00;
--cat-macro:#0071e3;--cat-broker:#8B5CF6;--cat-announce:#34c759;
--cat-market:#ff9500;--cat-overseas:#06B6D4;--cat-sentiment:#EC4899;
--watch-color:#0071e3;
--tag-bg:#f0f0f2;--tag-text:#86868b;
--shadow-sm:0 1px 3px rgba(0,0,0,.04);
--shadow-md:0 4px 16px rgba(0,0,0,.06);
--shadow-lg:0 8px 30px rgba(0,0,0,.08);
--radius-sm:8px;--radius-md:12px;--radius-lg:16px;--radius-xl:20px;
--font-display:"Inter","Noto Sans SC","PingFang SC",sans-serif;
--font-body:"Inter","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
--ease-out:cubic-bezier(.16,1,.3,1);
--ease-spring:cubic-bezier(.34,1.56,.64,1);
}
@media(prefers-color-scheme:dark){
:root{--bg:#1c1c1e;--bg-soft:#2c2c2e;--bg-hover:#3a3a3c;--bg-glass:rgba(44,44,46,.8);
--ink:#f5f5f7;--ink-2:#a1a1a6;--ink-3:#6e6e73;
--line:rgba(255,255,255,.08);--line-strong:rgba(255,255,255,.15);
--accent:#0a84ff;--accent-light:#1c2c40;--accent-dark:#409cff;
--green:#30d158;--green-dark:#28a745;
--cat-macro:#0a84ff;--cat-broker:#a78bfa;--cat-announce:#30d158;
--cat-market:#ff9f0a;--cat-overseas:#40d4e0;--cat-sentiment:#f47b9e;
--watch-color:#0a84ff;
--tag-bg:#3a3a3c;--tag-text:#a1a1a6;
--shadow-sm:0 1px 3px rgba(0,0,0,.3);
--shadow-md:0 4px 16px rgba(0,0,0,.4);
--shadow-lg:0 8px 30px rgba(0,0,0,.5);}
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);
font-family:var(--font-body);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;
overflow-x:hidden;overflow-wrap:anywhere}
a{color:inherit;text-decoration:none}
button{font-family:var(--font-body)}

/* ===== 布局 ===== */
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}

/* ===== 侧边栏 ===== */
.side{background:var(--bg-glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;gap:2px;
position:sticky;top:0;height:100vh;overflow-y:auto;
animation:slide-right .4s var(--ease-out)}
@keyframes slide-right{from{transform:translateX(-16px);opacity:0}to{transform:translateX(0);opacity:1}}
.side::-webkit-scrollbar{width:4px}
.side::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:2px}

.brand{display:flex;align-items:center;gap:10px;padding:8px;margin-bottom:12px}
.brand-icon{width:34px;height:34px;border-radius:var(--radius-sm);
display:grid;place-items:center;font-weight:800;font-size:15px;color:var(--ink);
border:2px solid var(--ink);letter-spacing:-.02em;font-family:var(--font-display)}
.brand-name{font-weight:800;font-size:15px;font-family:var(--font-display);letter-spacing:-.01em}
.brand-sub{font-size:10px;color:var(--ink-3);margin-top:1px}

.side-section{margin-top:16px;padding:0 10px;color:var(--ink-3);
font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:600}

.nav{margin-top:4px;display:flex;flex-direction:column;gap:1px}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;
border-radius:var(--radius-sm);color:var(--ink-2);cursor:pointer;font-size:13px;
transition:all .18s var(--ease-out);border:none;background:none;width:100%;text-align:left;font-weight:500}
.nav-item:hover{background:var(--bg-hover);color:var(--ink)}
.nav-item.active{background:var(--accent-light);color:var(--accent);font-weight:600}
.nav-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;transition:transform .2s}
.nav-item.active .nav-dot{transform:scale(1.3)}
.nav-count{margin-left:auto;font-size:10px;color:var(--ink-3);
font-weight:600;font-variant-numeric:tabular-nums}
.nav-item.active .nav-count{color:var(--accent)}

/* ===== 关键词面板 ===== */
.watch-panel{margin-top:16px;padding:14px;background:var(--bg-soft);
border:1px solid var(--line);border-radius:var(--radius-md);box-shadow:var(--shadow-sm)}
.watch-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.watch-title{font-size:12px;font-weight:700;color:var(--ink)}
.watch-count{font-size:10px;color:var(--watch-color);
background:var(--accent-light);padding:2px 8px;border-radius:999px;font-weight:600}
.watch-input{width:100%;height:32px;border:1px solid var(--line-strong);
border-radius:var(--radius-sm);background:var(--bg);color:var(--ink);
padding:0 10px;font-size:12px;outline:none;font-family:var(--font-body);
margin-bottom:6px;transition:all .2s}
.watch-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-light)}
.watch-input::placeholder{color:var(--ink-3)}
.watch-hint{font-size:10px;color:var(--ink-3);line-height:1.5}
.watch-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.watch-tag{height:22px;display:inline-flex;align-items:center;gap:4px;
border-radius:6px;background:var(--accent-light);color:var(--watch-color);
padding:0 8px;font-size:10px;font-weight:600;cursor:pointer;
transition:all .2s var(--ease-spring);animation:tag-pop .3s var(--ease-spring)}
@keyframes tag-pop{from{transform:scale(0)}to{transform:scale(1)}}
.watch-tag:hover{background:var(--accent);color:#fff}
.watch-tag .rm{font-size:12px;opacity:.6;line-height:1}

/* ===== 统计面板 ===== */
.stats-box{margin-top:auto;padding:14px;background:var(--bg-soft);
border-radius:var(--radius-md);border:1px solid var(--line);box-shadow:var(--shadow-sm)}
.stats-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:5px 0}
.stats-label{color:var(--ink-3)}
.stats-val{font-weight:700;font-family:var(--font-display);color:var(--ink);
font-variant-numeric:tabular-nums}

.side-bottom{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);
display:flex;flex-direction:column;gap:2px}
.side-toggle{display:flex;align-items:center;gap:9px;padding:7px 10px;
border-radius:var(--radius-sm);color:var(--ink-3);cursor:pointer;font-size:12px;
transition:all .18s;border:none;background:none;width:100%;text-align:left}
.side-toggle:hover{background:var(--bg-hover);color:var(--ink-2)}

/* ===== 主区域 ===== */
.main{display:flex;flex-direction:column;min-width:0;flex:1;overflow:visible}

.page{padding:32px 36px 64px;max-width:960px;margin:0 auto;width:100%;min-width:0;box-sizing:border-box}

.page-header{display:flex;align-items:flex-start;justify-content:space-between;
gap:18px;margin-bottom:24px;flex-wrap:wrap;animation:fade-up .4s var(--ease-out)}
@keyframes fade-up{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}
.page-title{font-family:var(--font-display);font-size:28px;font-weight:800;
letter-spacing:-.02em;margin:0 0 6px;color:var(--ink)}
.page-subtitle{font-size:13px;color:var(--ink-2);margin:0}

.header-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;
font-size:12px;color:var(--ink);background:var(--bg-soft);
border:1px solid var(--line-strong);border-radius:var(--radius-sm);
cursor:pointer;transition:all .22s var(--ease-out);font-family:var(--font-body);
font-weight:500}
.btn:hover{background:var(--bg-hover);border-color:var(--ink-3)}
.btn.primary{background:var(--accent);color:#fff;border-color:transparent}
.btn.primary:hover{background:var(--accent-dark)}
.btn.sm{padding:7px 13px;font-size:12px}

.data-source-badge{display:inline-flex;align-items:center;gap:5px;
height:26px;padding:0 11px;border-radius:999px;
font-size:11px;font-weight:600;transition:all .3s}
.data-source-badge.demo{background:rgba(255,149,0,.1);color:var(--orange)}
.data-source-badge.live{background:rgba(52,199,89,.1);color:var(--green-dark)}

.pill-live{display:inline-flex;align-items:center;gap:7px;
padding:5px 13px 5px 9px;background:var(--bg-soft);
border:1px solid var(--line-strong);border-radius:999px;
font-size:12px;color:var(--ink-2);transition:all .3s}
.pill-live .dot{width:8px;height:8px;border-radius:50%;background:var(--green);
animation:pulse-ring 2s infinite}
.pill-live.syncing .dot{background:var(--accent);animation:spin 1s linear infinite}
@keyframes pulse-ring{0%{box-shadow:0 0 0 0 rgba(52,199,89,.4)}70%{box-shadow:0 0 0 8px rgba(52,199,89,0)}100%{box-shadow:0 0 0 0 rgba(52,199,89,0)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== 分类标签栏 ===== */
.cat-bar{display:flex;align-items:center;gap:0;margin-bottom:24px;
border-bottom:1px solid var(--line);animation:fade-up .4s var(--ease-out) .05s both}
.cat-tab{position:relative;padding:8px 16px;font-size:14px;font-weight:500;
color:var(--ink-2);cursor:pointer;border:none;background:none;
transition:color .2s;white-space:nowrap;display:flex;align-items:center;gap:6px}
.cat-tab:hover{color:var(--ink)}
.cat-tab.active{color:var(--accent);font-weight:600}
.cat-tab.active::after{content:'';position:absolute;bottom:-1px;left:16px;right:16px;
height:2px;background:var(--accent);border-radius:1px}
.cat-tab .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;transition:transform .2s}
.cat-tab.active .dot{transform:scale(1.3)}
.cat-spacer{flex:1}

/* ===== 工具栏 ===== */
.toolbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;
margin-bottom:24px;animation:fade-up .4s var(--ease-out) .1s both}
.toolbar-group{display:flex;align-items:center;gap:8px}
.toolbar-label{font-size:12px;color:var(--ink-3);white-space:nowrap;font-weight:600}

.star-control{display:flex;align-items:center;gap:10px}
.star-slider{-webkit-appearance:none;appearance:none;width:140px;height:5px;
border-radius:3px;background:var(--line-strong);outline:none;transition:background .2s}
.star-slider::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;
border-radius:50%;background:var(--accent);cursor:pointer;
border:2px solid var(--bg-soft);box-shadow:0 2px 6px rgba(0,113,227,.3);
transition:transform .15s var(--ease-spring)}
.star-slider::-webkit-slider-thumb:hover{transform:scale(1.15)}
.star-label{font-size:12px;font-weight:700;color:var(--accent);
min-width:52px;font-family:var(--font-display)}

.search-box{display:flex;align-items:center;gap:8px;flex:1;min-width:180px;max-width:340px}
.search-box input{flex:1;height:32px;border:1px solid var(--line-strong);
border-radius:var(--radius-sm);background:var(--bg-soft);color:var(--ink);
padding:0 12px;font-size:12px;outline:none;font-family:var(--font-body);
transition:all .2s}
.search-box input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-light)}
.search-box input::placeholder{color:var(--ink-3)}

.search-btn{height:32px;padding:0 14px;border:none;border-radius:var(--radius-sm);
background:var(--green-dark);color:#fff;font-size:12px;font-weight:600;
cursor:pointer;transition:all .2s;font-family:var(--font-body)}
.search-btn:hover{background:var(--green);transform:translateY(-1px)}

/* ===== KPI 卡片 ===== */
.kpi-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px;
animation:fade-up .4s var(--ease-out) .15s both}
.kpi{background:var(--bg-soft);border:1px solid var(--line);
border-radius:var(--radius-md);padding:18px 20px;position:relative;overflow:hidden;
transition:all .3s var(--ease-out);box-shadow:var(--shadow-sm)}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.kpi-label{font-size:11px;color:var(--ink-3);letter-spacing:.04em;
text-transform:uppercase;font-weight:600;margin-bottom:6px}
.kpi-value{font-size:26px;font-weight:800;letter-spacing:-.03em;
color:var(--ink);font-family:var(--font-display);font-variant-numeric:tabular-nums;
line-height:1.15}
.kpi-delta{font-size:11px;color:var(--ink-3);margin-top:4px;font-weight:500}
.kpi-delta.up{color:var(--green-dark)}

/* ===== 新闻卡片 ===== */
.news-feed{display:flex;flex-direction:column;gap:14px;width:100%;min-width:0}

.news-card{background:var(--bg-soft);border:1px solid var(--line);
border-radius:var(--radius-lg);padding:20px 22px;
transition:all .25s var(--ease-out);position:relative;
box-shadow:var(--shadow-sm);
animation:card-enter .35s var(--ease-out) both;word-break:break-word;overflow-wrap:anywhere;box-sizing:border-box;width:100%}
@keyframes card-enter{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}
.news-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:var(--line-strong)}
.news-card.highlighted{border-left:3px solid var(--accent)}
.news-card.watched{border-left:3px solid var(--watch-color)}

.news-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.news-cat{height:22px;display:inline-flex;align-items:center;gap:5px;
border-radius:6px;padding:0 9px;font-size:10.5px;font-weight:700}
.news-meta{font-size:11px;color:var(--ink-3);
display:flex;align-items:center;gap:8px}
.news-stars{margin-left:auto;display:flex;gap:2px;font-size:13px;letter-spacing:1.5px}
.news-stars .filled{color:var(--yellow);text-shadow:0 1px 2px rgba(255,204,0,.2)}
.news-stars .empty{color:var(--line-strong)}

.news-title{font-size:16px;font-weight:700;line-height:1.5;margin-bottom:8px;color:var(--ink);
transition:color .2s;overflow-wrap:anywhere;letter-spacing:-.005em;cursor:pointer}
.news-card:hover .news-title{color:var(--accent)}

.news-summary{font-size:13.5px;color:var(--ink-2);line-height:1.7;overflow-wrap:anywhere}
.news-summary strong{color:var(--ink-3);font-weight:600}

.news-tags{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.tag{height:22px;display:inline-flex;align-items:center;border-radius:6px;
background:var(--tag-bg);color:var(--tag-text);padding:0 9px;font-size:10.5px;font-weight:500;
transition:all .2s;cursor:pointer}
.tag:hover{background:var(--line-strong);color:var(--ink-2)}
.tag-watched{background:var(--accent-light);color:var(--watch-color)}

.news-link{display:inline-flex;align-items:center;gap:4px;margin-top:11px;
font-size:12px;font-weight:600;color:var(--accent);
transition:all .2s var(--ease-out)}
.news-link:hover{gap:6px;text-decoration:underline}

/* ===== 时间线 ===== */
.date-divider{text-align:center;margin:20px 0 14px;position:relative}
.date-divider:before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px solid var(--line)}
.date-divider span{position:relative;background:var(--bg-glass);backdrop-filter:blur(10px);
padding:4px 16px;font-size:12px;font-weight:600;color:var(--ink-3);border-radius:20px;border:1px solid var(--line)}
.timeline-group{position:relative;padding-left:0;
animation:card-enter .35s var(--ease-out) both;margin-bottom:14px}
.time-label{display:block;font-size:13px;font-weight:700;
color:var(--ink);font-family:var(--font-display);padding:0 0 10px;letter-spacing:.01em}

/* ===== 简报模式 ===== */
.brief-mode .news-card{padding:14px 18px}
.brief-mode .news-summary,.brief-mode .news-tags,
.brief-mode .news-meta{display:none}
.brief-mode .news-title{font-size:13.5px;margin-bottom:0}
.brief-mode .news-card:hover{transform:none}

/* ===== 空状态 ===== */
.empty-state{text-align:center;padding:60px 28px;color:var(--ink-3);
border:2px dashed var(--line-strong);border-radius:var(--radius-xl);
animation:fade-up .4s var(--ease-out)}
.empty-state-icon{font-size:42px;margin-bottom:16px;opacity:.6}
.empty-state-text{font-size:15px;margin-bottom:7px;font-weight:600;color:var(--ink-2)}
.empty-state-hint{font-size:12px}

/* ===== 骨架屏 ===== */
.skeleton{background:linear-gradient(90deg,var(--bg-hover) 25%,var(--bg-soft) 50%,var(--bg-hover) 75%);
background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:var(--radius-lg);height:110px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ===== Footer ===== */
.footer{text-align:center;padding:36px 0 18px;color:var(--ink-3);
font-size:11px;border-top:1px solid var(--line);margin-top:48px}
.footer a{color:var(--ink-2);transition:color .2s}
.footer a:hover{color:var(--accent)}

/* ===== Toast ===== */
.toast{position:fixed;bottom:28px;left:50%;
transform:translateX(-50%) translateY(80px);
background:var(--ink);color:var(--bg-soft);padding:12px 24px;
border-radius:var(--radius-md);font-size:13px;font-weight:500;opacity:0;
transition:all .3s var(--ease-spring);z-index:100;pointer-events:none;
box-shadow:var(--shadow-lg);backdrop-filter:blur(10px)}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* ===== 响应式 ===== */
@media(max-width:980px){
.app{grid-template-columns:1fr}
.side{display:none}
.page{padding:24px 18px 48px}
.kpi-bar{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:640px){
.kpi-bar{grid-template-columns:1fr 1fr}
.toolbar{flex-direction:column;align-items:stretch}
.search-box{max-width:none}
.header-actions{width:100%}
.header-actions .btn{flex:1;justify-content:center}
.kpi-value{font-size:22px}
.page-title{font-size:22px}
.news-card{padding:16px}
.cat-tab{padding:6px 10px;font-size:13px}
}
</style>
</head>
<body>
<div class="app">
<aside class="side">
<div class="brand">
<div class="brand-icon">N</div>
<div>
<div class="brand-name">NewsPulse</div>
<div class="brand-sub">AI 筛选要闻聚合</div>
</div>
</div>

<div class="side-section">分类导航</div>
<nav class="nav" id="sideNav">
<button class="nav-item active" data-cat="all"><span class="nav-dot" style="background:var(--accent)"></span>全部要闻<span class="nav-count" id="countAll">0</span></button>
<button class="nav-item" data-cat="宏观政策"><span class="nav-dot" style="background:var(--cat-macro)"></span>宏观政策<span class="nav-count" id="countMacro">0</span></button>
<button class="nav-item" data-cat="券商动态"><span class="nav-dot" style="background:var(--cat-broker)"></span>券商动态<span class="nav-count" id="countBroker">0</span></button>
<button class="nav-item" data-cat="公司公告"><span class="nav-dot" style="background:var(--cat-announce)"></span>公司公告<span class="nav-count" id="countAnnounce">0</span></button>
<button class="nav-item" data-cat="市场异动"><span class="nav-dot" style="background:var(--cat-market)"></span>市场异动<span class="nav-count" id="countMarket">0</span></button>
<button class="nav-item" data-cat="海外联动"><span class="nav-dot" style="background:var(--cat-overseas)"></span>海外联动<span class="nav-count" id="countOverseas">0</span></button>
<button class="nav-item" data-cat="市场情绪"><span class="nav-dot" style="background:var(--cat-sentiment)"></span>市场情绪<span class="nav-count" id="countSentiment">0</span></button>
</nav>

<div class="watch-panel">
<div class="watch-header"><span class="watch-title">关注关键词</span><span class="watch-count" id="watchCountBadge">0 条匹配</span></div>
<input class="watch-input" id="watchInput" placeholder="输入关键词，逗号分隔" value="">
<div class="watch-hint">输入后按回车保存，匹配的新闻会高亮显示。</div>
<div class="watch-tags" id="watchTags"></div>
</div>

<div class="side-bottom">
<div class="stats-box" style="border:none;padding:0;box-shadow:none">

<div>

<div class="toolbar">
<div class="toolbar-group">

</div>
<div class="search-box">

<div class="kpi"><div class="kpi-label">数据更新于</div><div class="kpi-value" id="kpiUpdated">—</div><div class="kpi-delta" id="kpiUpdateDelta">等待同步</div></div>
</div>

<div class="news-feed" id="newsFeed"></div>
<div class="empty-state" id="emptyState" style="display:none">
<div class="empty-state-icon">🔍</div><div class="empty-state-text">当前筛选条件下暂无新闻</div>
<div class="empty-state-hint">试试降低重要性门槛或更换分类</div>
</div>

<footer class="footer">
<p>NewsPulse · AI 驱动的金融要闻聚合平台 · <a href="https://github.com/PlumeLyo/news-aggregator">GitHub</a></p>
<p style="margin-top:4px">管道每 30 分钟自动同步 · 由 GitHub Actions + LLM 驱动</p>
</footer>
</div>
</main>
</div>

{id:"o5p6q7r8s9t0",title:"头部券商Q2末经纪业务市占率环比提升",source:"公司公告",category:"公司公告",stars:3,time:"17:00",summary:"市场份额稳步扩张，财富管理转型成效显现。零售客户数量保持行业前三梯队，综合竞争力持续增强。",tags:["市占率","经纪业务","Q2"],url:"#"}
];

var NEWS_DATA = [];
var CAT_COLORS={"宏观政策":"var(--cat-macro)","券商动态":"var(--cat-broker)","公司公告":"var(--cat-announce)","市场异动":"var(--cat-market)","海外联动":"var(--cat-overseas)","市场情绪":"var(--cat-sentiment)"};
var curCat="all",curStar=3,searchQuery="",isBriefMode=false,isLiveMode=false;
var watchKeywords=[];

function gid(id){return document.getElementById(id);}
var feed=gid("newsFeed"),empty=gid("emptyState"),starLabel=gid("starLabel");
var searchInput=gid("searchInput");

// ===== 数字滚动动画 =====
function animateNumber(el,target,duration){
  if(!duration)duration=600;
  var start=0,startTime=null;
  function step(ts){if(!startTime)startTime=ts;var progress=Math.min((ts-startTime)/duration,1);
  var eased=1-Math.pow(1-progress,3);el.textContent=Math.round(start+(target-start)*eased);
  if(progress<1)requestAnimationFrame(step);}
  requestAnimationFrame(step);
}

// ===== 关键词系统 =====
function loadWatchKeywords(){try{var s=localStorage.getItem("np_watch");if(s){watchKeywords=JSON.parse(s).filter(function(k){return k.trim().length>0;});}}catch(e){}renderWatchTags();}
function saveWatchKeywords(){localStorage.setItem("np_watch",JSON.stringify(watchKeywords));renderWatchTags();render();}
function renderWatchTags(){var c=gid("watchTags");if(!watchKeywords.length){c.innerHTML='<span style="font-size:11px;color:var(--ink-3)">暂无关键词</span>';return;}c.innerHTML="";
for(var i=0;i<watchKeywords.length;i++){(function(kw,idx){var t=document.createElement("span");t.className="watch-tag";t.innerHTML=kw+' <span class="rm">×</span>';
t.addEventListener("click",function(){watchKeywords.splice(idx,1);saveWatchKeywords();});c.appendChild(t)})(watchKeywords[i],i);}gid("watchCountBadge").textContent=countWatched()+" 条匹配";}
function isWatched(n){if(!watchKeywords.length)return false;var t=(n.title+" "+n.summary).toLowerCase();
for(var i=0;i<watchKeywords.length;i++)if(t.indexOf(watchKeywords[i].toLowerCase())>=0)return true;return false;}
function countWatched(){if(!watchKeywords.length)return 0;var c=0;
for(var i=0;i<NEWS_DATA.length;i++)if(isWatched(NEWS_DATA[i]))c++;return c;}

// ===== 渲染核心 =====
function starsHtml(n){var s="";for(var i=1;i<=5;i++)s+=i<=n?'<span class="filled">★</span>':'<span class="empty">☆</span>';return s;}
function catBadge(cat){var color=CAT_COLORS[cat]||"var(--ink-3)";
return'<span class="news-cat" style="background:color-mix(in srgb,'+color+' 12%,transparent);color:'+color+'">'+cat+'</span>';}

function render(){
var filtered=NEWS_DATA.filter(function(n){
if(curCat!=="all"&&n.category!==curCat)return false;if(n.stars<curStar)return false;
if(searchQuery&&n.title.toLowerCase().indexOf(searchQuery.toLowerCase())<0&&n.summary.toLowerCase().indexOf(searchQuery.toLowerCase())<0)return false;return true;});

// 动画更新 KPI
animateNumber(gid("kpiTotal"),NEWS_DATA.length);
animateNumber(gid("kpiMajor"),NEWS_DATA.filter(function(n){return n.stars>=4}).length);
animateNumber(gid("kpiWatched"),countWatched());
gid("kpiUpdated").textContent=isLiveMode?"LIVE":"DEMO";

animateNumber(gid("statTotal"),NEWS_DATA.length);
animateNumber(gid("statMajor"),NEWS_DATA.filter(function(n){return n.stars>=4}).length);
animateNumber(gid("statWatched"),countWatched());
gid("statSource").textContent=isLiveMode?"实时":"演示";

animateNumber(gid("countAll"),NEWS_DATA.length);
animateNumber(gid("countMacro"),NEWS_DATA.filter(function(n){return n.category==="宏观政策"}).length);
animateNumber(gid("countBroker"),NEWS_DATA.filter(function(n){return n.category==="券商动态"}).length);
animateNumber(gid("countAnnounce"),NEWS_DATA.filter(function(n){return n.category==="公司公告"}).length);
animateNumber(gid("countMarket"),NEWS_DATA.filter(function(n){return n.category==="市场异动"}).length);
animateNumber(gid("countOverseas"),NEWS_DATA.filter(function(n){return n.category==="海外联动"}).length);
animateNumber(gid("countSentiment"),NEWS_DATA.filter(function(n){return n.category==="市场情绪"}).length);
gid("watchCountBadge").textContent=countWatched()+" 条匹配";

empty.style.display=filtered.length?"none":"block";feed.className="news-feed"+(isBriefMode?" brief-mode":"");
if(!filtered.length){feed.innerHTML="";return;}
var grouped={};for(var fi=0;fi<filtered.length;fi++){var n=filtered[fi];var d=n.date||"";var h=n.time.split(":")[0];var gk=d+"|"+h;if(!grouped[gk])grouped[gk]={date:d,hour:h,items:[]};grouped[gk].items.push(n);}

// ★ 核心：按日期+小时倒序排列
var groups=Object.keys(grouped).sort(function(a,b){return b.localeCompare(a);}),html="";
var cardIdx=0;var lastDate="";
var todayStr=new Date().toISOString().slice(0,10);
var yesterdayStr=new Date(Date.now()-86400000).toISOString().slice(0,10);
for(var gi=0;gi<groups.length;gi++){
var g=grouped[groups[gi]];var d=g.date;var h=g.hour;var items=g.items;
// 日期分隔符
if(d!==lastDate){lastDate=d;var dateLabel=d===todayStr?"今天":(d===yesterdayStr?"昨天":d);html+='<div class="date-divider"><span>'+dateLabel+'</span></div>';}
items.sort(function(a,b){ return b.time.localeCompare(a.time); });

html+='<div class="timeline-group" style="animation-delay:'+(cardIdx*0.05)+'s"><span class="time-label">'+h+':00</span>';
for(var ii=0;ii<items.length;ii++){
var n=items[ii],w=isWatched(n),hlClass="";if(n.stars>=4)hlClass+=" highlighted";if(w)hlClass+=" watched";
var wTag=w?'<span class="tag tag-watched">匹配关键词</span>':"",tHtml="";
for(var ti2=0;ti2<n.tags.length;ti2++)tHtml+='<span class="tag">#'+n.tags[ti2]+'</span>';
html+='<div class="news-card'+hlClass+'" style="animation-delay:'+(cardIdx*0.04)+'s">';
html+='<div class="news-top">'+catBadge(n.category)+'<span class="news-meta">'+n.source+" · "+n.time+"</span>";
html+='<span class="news-stars">'+starsHtml(n.stars)+"</span></div>";
html+='<div class="news-title">'+n.title+"</div>";
html+='<div class="news-summary"><strong>AI 摘要：</strong>'+n.summary+"</div>";
html+='<div class="news-tags">'+tHtml+wTag+'</div>';
var linkUrl=n.url&&n.url!=="#"?n.url:"";
if(linkUrl){html+='<a href="'+linkUrl+'" target="_blank" rel="noopener" class="news-link">查看原文 →</a>';}
html+='</div>';
cardIdx++;}
html+="</div>";}
feed.innerHTML=html;}

function toast(msg){var t=gid("toast");t.textContent=msg;t.classList.add("show");setTimeout(function(){t.classList.remove("show")},2200);}

// ===== 数据加载 =====
function loadLiveData(){
isLiveMode=false;
var pill=gid("livePill");pill.classList.add("syncing");gid("liveText").textContent="正在拉取实时数据…";
feed.innerHTML='<div class="skeleton" style="margin-bottom:12px"></div><div class="skeleton" style="margin-bottom:12px"></div><div class="skeleton" style="margin-bottom:12px"></div>';

fetch(DATA_CONFIG.LIVE_DATA_URL,{cache:"no-store",headers:{"Cache-Control":"no-cache"}})
.then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})
.then(function(data){
if(data&&data.news&&Array.isArray(data.news)){
NEWS_DATA=data.news;isLiveMode=true;
dataSourceBadge.className="data-source-badge live";dataSourceBadge.textContent="实时数据";
if(data.fetched_at){var d=new Date(data.fetched_at);gid("kpiUpdated").textContent=d.getHours()+":"+String(d.getMinutes()).padStart(2,"0");}
gid("kpiUpdateDelta").textContent="已同步";
gid("liveText").textContent="实时数据 · "+NEWS_DATA.length+"条";
toast("已加载 "+NEWS_DATA.length+" 条实时新闻");
}else{throw new Error("Invalid data format");}})
.catch(function(err){
console.warn("实时数据加载失败，使用演示数据:",err.message);
NEWS_DATA=DEMO_DATA.slice();isLiveMode=false;
dataSourceBadge.className="data-source-badge demo";dataSourceBadge.textContent="演示数据";
gid("kpiUpdateDelta").textContent="使用内置数据";
gid("liveText").textContent="演示模式";
toast("使用演示数据（"+DEMO_DATA.length+"条）");})
.then(function(){
pill.classList.remove("syncing");
render();
});
}

// ===== 事件绑定 =====
document.querySelectorAll(".cat-tab,.nav-item").forEach(function(b){
b.addEventListener("click",function(){curCat=b.dataset.cat;
document.querySelectorAll(".cat-tab").forEach(function(x){x.classList.toggle("active",x.dataset.cat===curCat);});
document.querySelectorAll(".nav-item").forEach(function(x){x.classList.toggle("active",x.dataset.cat===curCat);});render();});});

gid("starSlider").addEventListener("input",function(e){curStar=Number(e.target.value);starLabel.textContent="≥ "+curStar+"★";render();});
searchInput.addEventListener("input",function(e){searchQuery=e.target.value.trim();render();});
gid("searchBtn").addEventListener("click",function(){searchQuery=searchInput.value.trim();render();});
gid("briefBtn").addEventListener("click",function(){isBriefMode=!isBriefMode;gid("briefBtn").textContent=isBriefMode?"详情":"简报";render();toast(isBriefMode?"已切换到简报模式":"已切换到详情模式");});
gid("refreshBtn").addEventListener("click",function(){loadLiveData();});
gid("watchInput").addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();var val=e.target.value.trim();if(!val)return;
val.split(/[,，]/).map(function(s){return s.trim();}).filter(function(s){return s&&watchKeywords.indexOf(s)<0;}).forEach(function(k){watchKeywords.push(k);});saveWatchKeywords();e.target.value="";}});

// ===== 初始化 =====
var today=new Date(),weekDays=["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
gid("dateStr").textContent=today.getFullYear()+"年"+(today.getMonth()+1)+"月"+today.getDate()+"日 "+weekDays[today.getDay()]+" · AI 自动筛选聚合";

var dataSourceBadge=gid("dataSourceBadge");

loadWatchKeywords();

if(DATA_CONFIG.TRY_LIVE_FIRST){loadLiveData();}else{NEWS_DATA=DEMO_DATA.slice();render();}

if(DATA_CONFIG.AUTO_REFRESH_MS>0){setInterval(loadLiveData,DATA_CONFIG.AUTO_REFRESH_MS);}
</script>
</body>
</html>
